name: Bug report
description: Report incorrect results, errors, or crashes
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. A minimal reproducible example makes it much faster to fix.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: mwe
    attributes:
      label: Minimal reproducible example
      description: Paste code that runs in a fresh Julia session. Use `julia` code blocks.
      render: julia
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output or error message
      description: Paste the full output, including the stack trace if there is one.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: If this is a numerical problem, include the closed-form or reference value you compared against.
    validations:
      required: false

  - type: input
    id: package_version
    attributes:
      label: Package version
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: input
    id: julia_version
    attributes:
      label: Julia version
      description: Output of `versioninfo()`, first line only is fine.
      placeholder: "e.g. 1.11.2"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Output of `Pkg.status()` and any other relevant packages (BLAS backend, Julia threads, etc.).
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this has not been reported.
          required: true
        - label: I tested with the latest released version.
          required: true